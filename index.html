<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texas Hold'em vs AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Texas Hold'em</h1>
    <p class="subtitle" id="blinds-info">No-limit Hold'em. You vs three Monte Carlo bots.</p>
  </header>

  <main class="layout">
    <section class="table" aria-label="Poker table">
      <div class="seat seat-top" id="seat-2"></div>
      <div class="seat seat-left" id="seat-1"></div>
      <div class="seat seat-right" id="seat-3"></div>

      <div class="center">
        <div class="board" id="board"></div>
        <div class="pot" id="pot"></div>
        <div class="message" id="message"></div>
      </div>

      <div class="seat seat-bottom" id="seat-0"></div>
    </section>

    <aside class="side">
      <div class="advisor" id="advisor"></div>
      <h2>Hand history</h2>
      <ol class="log" id="log"></ol>
    </aside>
  </main>

  <section class="controls" id="controls" aria-label="Your actions">
    <button id="fold" class="btn btn-fold">Fold</button>
    <button id="check-call" class="btn">Check</button>
    <div class="raise-group">
      <input id="raise-slider" type="range" min="0" max="0" step="10" aria-label="Raise amount">
      <input id="raise-input" type="number" min="0" step="10" aria-label="Raise to">
      <button id="raise" class="btn btn-raise">Raise</button>
    </div>
    <button id="next-hand" class="btn btn-next" hidden>Deal next hand</button>
    <button id="new-game" class="btn btn-next" hidden>New game</button>
  </section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
